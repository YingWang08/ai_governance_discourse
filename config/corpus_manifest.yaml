  - id: g7_hiroshima_2023
    title: "G7 Hiroshima Process International Guiding Principles (2023)"
    body: G7
    year: 2023
    file: g7_hiroshima_2023.txt   # ⚠️ 注意是 .txt 不是 .pdf
    source_type: html
    expected_min_kb: 20
    url: "https://digital-strategy.ec.europa.eu/en/library/hiroshima-process-international-guiding-principles-advanced-ai-system"
    fallback_urls:
      - "https://www.whitehouse.gov/briefing-room/statements-releases/2023/10/30/g7-hiroshima-process-international-guiding-principles-for-advanced-ai-systems/"
    notes: |
      G7 Hiroshima 没有独立PDF，是HTML页面。
      操作: 浏览器打开链接 → 全选正文 → 保存为 data/raw/g7_hiroshima_2023.txt
      01_ingest 会自动识别 .txt 文件。

