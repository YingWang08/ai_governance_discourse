# =====================================================================
# Corpus Manifest  (修复版)
# ---------------------------------------------------------------------
# 关键修复：
#   #1  OECD 2019 和 2024 不再共用同一个URL（会被自动重定向到最新版）。
#       2019版本指向 Wayback Machine 的早期存档。
#   #2  每个文档增加 expected_min_kb 字段，下载后可自动验证大小合理。
#   #3  增加 archived_at 字段，记录URL访问/存档的具体日期。
#   #4  增加 source_type 字段（pdf/html），明确处理方式。
#
# 工作流：
#   1. 手动下载每份文件到 data/raw/，文件名必须与 `file` 字段一致
#   2. 运行 00_auto_cleaning.py，会自动计算 SHA-256 指纹
#      并写入 output/tables/corpus_fingerprints.csv
#   3. 指纹文件务必提交到代码仓库，作为版本证据
# =====================================================================

documents:
  - id: oecd_2019
    title: "OECD Recommendation of the Council on Artificial Intelligence (2019 original)"
    body: OECD
    year: 2019
    file: oecd_2019.pdf
    source_type: pdf
    expected_min_kb: 100
    # ⚠️ 关键：OECD 当前页面会自动重定向到 2024 修订版。
    # 必须使用 Wayback Machine 早期快照，或在 OECD 历史档案中找到 2019 原始 PDF。
    url: "https://web.archive.org/web/2020*/legalinstruments.oecd.org/en/instruments/OECD-LEGAL-0449"
    fallback_urls:
      - "https://web.archive.org/web/2020/https://legalinstruments.oecd.org/en/instruments/OECD-LEGAL-0449"
      - "https://www.oecd.org/going-digital/ai/principles/"
    notes: |
      下载步骤:
      1. 访问 https://web.archive.org
      2. 输入 "legalinstruments.oecd.org/en/instruments/OECD-LEGAL-0449"
      3. 在2019-05 到 2024-04 之间选择一个快照
      4. 下载快照页面上的 PDF，重命名为 oecd_2019.pdf
      下载后人工核查：文档内不应有 "2024" 修订标记。

  - id: g20_2019
